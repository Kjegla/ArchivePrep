name: Build releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The core imports no tkinter, so almost the whole suite runs anywhere.
  # Only the handful of window-wiring tests need a display, and those run on
  # the Windows job below.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the suite (everything that needs no screen)
        run: python -m pytest tests/ -q -m "not gui"

  build-windows:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt pyinstaller
      - name: Run the full suite, including the window-wiring tests
        run: python -m pytest tests/ -q
      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --noconfirm --collect-all sv_ttk --name PhotoOrganizer photo_organizer.py
      - name: Rename artifact
        run: Move-Item dist/PhotoOrganizer.exe dist/PhotoOrganizer-Windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: dist/PhotoOrganizer-Windows.exe

  build-macos:
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build app
        run: python -m PyInstaller --windowed --noconfirm --collect-all sv_ttk --name PhotoOrganizer photo_organizer.py
      - name: Zip the app bundle
        run: ditto -c -k --keepParent "dist/PhotoOrganizer.app" "dist/PhotoOrganizer-macOS.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: dist/PhotoOrganizer-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/PhotoOrganizer-Windows.exe
            dist/PhotoOrganizer-macOS.zip
