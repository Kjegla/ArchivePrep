name: Build releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --noconfirm --collect-all sv_ttk --name PhotoOrganizer photo_organizer.py
      - name: Rename artifact
        run: Move-Item dist/PhotoOrganizer.exe dist/PhotoOrganizer-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/PhotoOrganizer-Windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build app
        run: python -m PyInstaller --windowed --noconfirm --collect-all sv_ttk --name PhotoOrganizer photo_organizer.py
      - name: Zip the app bundle
        run: ditto -c -k --keepParent "dist/PhotoOrganizer.app" "dist/PhotoOrganizer-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/PhotoOrganizer-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PhotoOrganizer-Windows.exe
            dist/PhotoOrganizer-macOS.zip
